<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#sbg)" rx="10"/>
  <rect x="2" y="2" width="996" height="596" fill="none" stroke="#1e293b" stroke-width="2" rx="8"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#0f172a" rx="8"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#1e293b" stroke-width="1.5"/>
  <text x="25" y="32" fill="#00f0ff" font-family="monospace" font-size="16" font-weight="bold">ARINC710Forge Pro - Airborne ILS Receiver Studio</text>
  <rect x="670" y="15" width="145" height="22" fill="rgba(0,240,255,0.15)" stroke="#00f0ff" rx="4"/>
  <text x="682" y="30" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">ARINC 710 MARK 2</text>
  <rect x="825" y="15" width="150" height="22" fill="rgba(0,230,118,0.15)" stroke="#00e676" rx="4"/>
  <text x="837" y="30" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">CAT IIIb AUTOLAND</text>

  <!-- Left: PFD Instrument Display -->
  <g transform="translate(25, 70)">
    <rect width="460" height="305" fill="#050811" stroke="#1e293b" rx="6"/>
    <text x="18" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">PRIMARY FLIGHT DISPLAY (PFD) EADI</text>
    
    <!-- Sky / Ground -->
    <rect x="40" y="45" width="380" height="110" fill="#0284c7" rx="3"/>
    <rect x="40" y="155" width="380" height="110" fill="#78350f" rx="3"/>
    
    <!-- Horizon Line -->
    <line x1="40" y1="155" x2="420" y2="155" stroke="#f8fafc" stroke-width="2"/>

    <!-- Aircraft Symbol (Yellow) -->
    <rect x="180" y="152" width="35" height="6" fill="#eab308"/>
    <rect x="245" y="152" width="35" height="6" fill="#eab308"/>
    <rect x="225" y="150" width="10" height="10" fill="#eab308"/>

    <!-- Localizer Scale (Bottom Horizontal) -->
    <circle cx="150" cy="245" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="190" cy="245" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="230" cy="245" r="3.0" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="270" cy="245" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="310" cy="245" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Localizer Diamond (Magenta - on centerline) -->
    <polygon points="230,237 236,245 230,253 224,245" fill="#d946ef"/>

    <!-- Glideslope Scale (Right Vertical) -->
    <circle cx="390" cy="75" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="390" cy="115" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="390" cy="155" r="3.0" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="390" cy="195" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="390" cy="235" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Glideslope Diamond (Magenta - on slope) -->
    <polygon points="382,155 390,149 398,155 390,161" fill="#d946ef"/>

    <!-- Marker Annunciator (Middle Marker Amber) -->
    <circle cx="65" cy="70" r="14" fill="#d97706" stroke="#ffb300" stroke-width="2"/>
    <text x="56" y="74" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">MM</text>

    <!-- Autoland Status -->
    <rect x="290" y="55" width="120" height="20" fill="rgba(0,230,118,0.2)" stroke="#00e676" rx="3"/>
    <text x="298" y="69" fill="#00e676" font-family="monospace" font-size="10" font-weight="bold">LAND 3 / CAT IIIb</text>
  </g>

  <!-- Right: RF Receiver Parameters & ARINC 429 -->
  <g transform="translate(515, 70)">
    <rect width="460" height="305" fill="#131d31" stroke="#1e293b" rx="6"/>
    <text x="18" y="26" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">ILS RECEIVER RF TUNING &amp; ARINC 429</text>
    <rect x="345" y="12" width="100" height="20" fill="rgba(0,230,118,0.2)" stroke="#00e676" rx="3"/>
    <text x="355" y="26" fill="#00e676" font-family="monospace" font-size="10" font-weight="bold">ILS 1 ACTIVE</text>

    <text x="18" y="60" fill="#94a3b8" font-family="monospace" font-size="11">VHF Localizer:</text>
    <text x="160" y="60" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">109.30 MHz (Runway Centerline)</text>

    <text x="18" y="82" fill="#94a3b8" font-family="monospace" font-size="11">UHF Glideslope:</text>
    <text x="160" y="82" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">332.00 MHz (3.0° Standard Slope)</text>

    <text x="18" y="104" fill="#94a3b8" font-family="monospace" font-size="11">Localizer DDM:</text>
    <text x="160" y="104" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">0.0000 (0.0 dots | ON COURSE)</text>

    <text x="18" y="126" fill="#94a3b8" font-family="monospace" font-size="11">Glideslope DDM:</text>
    <text x="160" y="126" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">0.0000 (0.0 dots | ON GLIDEPATH)</text>

    <text x="18" y="148" fill="#94a3b8" font-family="monospace" font-size="11">Marker Beacon:</text>
    <text x="160" y="148" fill="#ffb300" font-family="monospace" font-size="11" font-weight="bold">MIDDLE MARKER (MM 1300 Hz)</text>

    <text x="18" y="170" fill="#94a3b8" font-family="monospace" font-size="11">Warning Flags:</text>
    <text x="160" y="170" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">LOC CLEAR / GS CLEAR (SDM Normal)</text>

    <!-- Mini ARINC 429 Table -->
    <rect x="15" y="195" width="430" height="95" fill="#0b1120" stroke="#334155" rx="4"/>
    <text x="25" y="215" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">LBL</text>
    <text x="75" y="215" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">FUNCTION</text>
    <text x="260" y="215" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">PAYLOAD</text>
    <text x="365" y="215" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">PARITY</text>

    <text x="25" y="238" fill="#f8fafc" font-family="monospace" font-size="10">0173</text>
    <text x="75" y="238" fill="#f8fafc" font-family="monospace" font-size="10">Localizer Deviation</text>
    <text x="260" y="238" fill="#38bdf8" font-family="monospace" font-size="10">0x00000 (0.0 dot)</text>
    <text x="365" y="238" fill="#00e676" font-family="monospace" font-size="10">ODD [P=1]</text>

    <text x="25" y="258" fill="#f8fafc" font-family="monospace" font-size="10">0174</text>
    <text x="75" y="258" fill="#f8fafc" font-family="monospace" font-size="10">Glideslope Deviation</text>
    <text x="260" y="258" fill="#38bdf8" font-family="monospace" font-size="10">0x00000 (0.0 dot)</text>
    <text x="365" y="258" fill="#00e676" font-family="monospace" font-size="10">ODD [P=0]</text>

    <text x="25" y="278" fill="#f8fafc" font-family="monospace" font-size="10">0033</text>
    <text x="75" y="278" fill="#f8fafc" font-family="monospace" font-size="10">ILS Frequency Tuning</text>
    <text x="260" y="278" fill="#38bdf8" font-family="monospace" font-size="10">0x01093 (109.30MHz)</text>
    <text x="365" y="278" fill="#00e676" font-family="monospace" font-size="10">ODD [P=1]</text>
  </g>

  <!-- Bottom: 10-Point Normative Auditor Scorecard -->
  <g transform="translate(25, 395)">
    <rect width="950" height="185" fill="#131d31" stroke="#1e293b" rx="6"/>
    <text x="18" y="28" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">10-POINT NORMATIVE AIRWORTHINESS AUDITOR SCORECARD</text>
    <rect x="760" y="12" width="175" height="22" fill="rgba(0,230,118,0.2)" stroke="#00e676" rx="4"/>
    <text x="770" y="27" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">10 / 10 RULES PASSED (100%)</text>

    <g transform="translate(18, 45)">
      <text x="0" y="18" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_01] VHF Localizer Allocation &amp; UHF GS Pairing (ICAO Annex 10)</text>
      <text x="0" y="42" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_02] ARINC 429 Bit 32 Odd Parity Rule (Labels 173, 174, 033)</text>
      <text x="0" y="66" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_03] Localizer DDM Scale Calibration (±0.155 = ±2.0 Dots Full Scale)</text>
      <text x="0" y="90" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_04] Glideslope DDM Scale Calibration (±0.175 = ±2.0 Dots Full Scale)</text>
      <text x="0" y="114" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_05] 75 MHz Marker Beacon Detection (Outer, Middle, Inner)</text>

      <text x="490" y="18" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_06] Localizer Warning Flag &amp; SSM Failure Warning Interlock</text>
      <text x="490" y="42" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_07] Glideslope Warning Flag &amp; SSM Failure Warning Interlock</text>
      <text x="490" y="66" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_08] Category IIIb Precision Autoland Fail-Operational Readiness</text>
      <text x="490" y="90" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_09] 90 Hz / 150 Hz Audio Filter Separation (≥35 dB Isolation)</text>
      <text x="490" y="114" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A710_10] Commercial Airframe 2-MCU Form Factor &amp; Cockpit EFIS ICD</text>
    </g>
  </g>
</svg>