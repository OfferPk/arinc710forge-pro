<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="1000" height="620" fill="url(#bg)" rx="12"/>
  <rect x="2" y="2" width="996" height="616" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>
  
  <!-- Title Header -->
  <text x="40" y="50" fill="#00f0ff" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">ARINC710Forge Pro - Airborne ILS Receiver Architecture</text>
  <text x="40" y="75" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">ARINC Characteristic 710 Mark 2 ILS Receiver &amp; RTCA DO-195 (LOC) / RTCA DO-192 (GS) / ICAO Annex 10 Vol I</text>

  <!-- Left: Antennas & RF Front-End -->
  <g transform="translate(40, 110)">
    <rect width="260" height="460" fill="#131d31" stroke="#334155" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="260" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">RF ANTENNA FRONT-ENDS</text>
    
    <rect x="15" y="55" width="230" height="75" fill="#0b1120" stroke="#00f0ff" stroke-width="1" rx="4"/>
    <text x="25" y="80" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">VHF Localizer Antenna</text>
    <text x="25" y="100" fill="#94a3b8" font-family="monospace" font-size="10">108.10 - 111.95 MHz (Odd tenths)</text>
    <text x="25" y="118" fill="#00e676" font-family="monospace" font-size="10">Horizontal Polarized Dipole</text>

    <rect x="15" y="145" width="230" height="75" fill="#0b1120" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="25" y="170" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">UHF Glideslope Antenna</text>
    <text x="25" y="190" fill="#94a3b8" font-family="monospace" font-size="10">329.15 - 335.00 MHz (40 Channels)</text>
    <text x="25" y="208" fill="#00e676" font-family="monospace" font-size="10">Radome Nose Array / Diplexer</text>

    <rect x="15" y="235" width="230" height="75" fill="#0b1120" stroke="#ffb300" stroke-width="1" rx="4"/>
    <text x="25" y="260" fill="#ffb300" font-family="monospace" font-size="12" font-weight="bold">75 MHz Marker Antenna</text>
    <text x="25" y="280" fill="#94a3b8" font-family="monospace" font-size="10">Fuselage Bottom Flush Boat</text>
    <text x="25" y="298" fill="#00e676" font-family="monospace" font-size="10">Outer / Middle / Inner Filters</text>

    <rect x="15" y="325" width="230" height="120" fill="#0b1120" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="25" y="350" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Channel Pairing Synthesis</text>
    <text x="25" y="372" fill="#94a3b8" font-family="monospace" font-size="10">• Auto UHF pairing from VHF LOC</text>
    <text x="25" y="390" fill="#94a3b8" font-family="monospace" font-size="10">• 50 kHz Channel Spacing</text>
    <text x="25" y="408" fill="#94a3b8" font-family="monospace" font-size="10">• Dual-Conversion Superhet</text>
    <text x="25" y="428" fill="#00e676" font-family="monospace" font-size="10">Form Factor: 2-MCU ARINC 600</text>
  </g>

  <!-- Middle: ILS Receiver DSP Core & DDM Demodulator -->
  <g transform="translate(360, 110)">
    <rect width="280" height="460" fill="#131d31" stroke="#00f0ff" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="280" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#00f0ff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">ARINC 710 ILS PROCESSOR</text>

    <!-- Localizer & Glideslope Demod Kernel -->
    <rect x="15" y="55" width="250" height="390" fill="#0b1120" stroke="#00e676" stroke-width="1.5" rx="6"/>
    <text x="25" y="80" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">90 Hz / 150 Hz DDM ENGINE</text>
    
    <text x="25" y="105" fill="#f8fafc" font-family="monospace" font-size="11">• Localizer DDM = (m150 - m90) / 100</text>
    <text x="25" y="125" fill="#f8fafc" font-family="monospace" font-size="11">• ±0.155 DDM = ±2.0 Dots Full Scale</text>
    <text x="25" y="145" fill="#f8fafc" font-family="monospace" font-size="11">• Runway Centerline DDM = 0.000</text>
    <text x="25" y="165" fill="#f8fafc" font-family="monospace" font-size="11">• Angular Sector: ±2.5° Course Width</text>
    
    <line x1="25" y1="180" x2="250" y2="180" stroke="#334155" stroke-width="1"/>
    
    <text x="25" y="200" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">GLIDESLOPE DEMODULATION</text>
    <text x="25" y="222" fill="#f8fafc" font-family="monospace" font-size="10">• Glideslope DDM = (m150 - m90) / 100</text>
    <text x="25" y="240" fill="#f8fafc" font-family="monospace" font-size="10">• ±0.175 DDM = ±2.0 Dots Full Scale</text>
    <text x="25" y="258" fill="#f8fafc" font-family="monospace" font-size="10">• 3.0° Standard Glide Path DDM = 0</text>
    <text x="25" y="278" fill="#f8fafc" font-family="monospace" font-size="10">• Path Sector: ±0.7° Vertical Width</text>

    <line x1="25" y1="292" x2="250" y2="292" stroke="#334155" stroke-width="1"/>

    <text x="25" y="312" fill="#ffb300" font-family="monospace" font-size="11" font-weight="bold">SAFETY FLAGS &amp; AUTOLAND</text>
    <text x="25" y="332" fill="#ff3366" font-family="monospace" font-size="10">• LOC Flag: Low SDM (&lt;25% or &gt;60%)</text>
    <text x="25" y="350" fill="#ff3366" font-family="monospace" font-size="10">• GS Flag: Low SDM (&lt;50% or &gt;110%)</text>
    <text x="25" y="368" fill="#00e676" font-family="monospace" font-size="10">• Cat IIIb Autoland Dual/Triple Link</text>
    <text x="25" y="386" fill="#f8fafc" font-family="monospace" font-size="10">• Marker Beacon Tone Detectors</text>
    <text x="25" y="405" fill="#00f0ff" font-family="monospace" font-size="10">• ARINC 429 Bit 32 Odd Parity</text>
    <text x="25" y="425" fill="#00e676" font-family="monospace" font-size="10">DO-195 &amp; DO-192 Certified</text>
  </g>

  <!-- Right: Cockpit Flight Deck Displays -->
  <g transform="translate(690, 110)">
    <rect width="270" height="460" fill="#131d31" stroke="#334155" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="270" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#00e676" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">COCKPIT PFD / EFIS</text>

    <!-- PFD Deviation Indicators -->
    <rect x="15" y="55" width="240" height="150" fill="#0b1120" stroke="#00e676" stroke-width="1" rx="4"/>
    <text x="25" y="80" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">Primary Flight Display (PFD)</text>
    <text x="25" y="105" fill="#d946ef" font-family="monospace" font-size="11">• Magenta Diamond LOC Deviation</text>
    <text x="25" y="125" fill="#d946ef" font-family="monospace" font-size="11">• Magenta Diamond GS Deviation</text>
    <text x="25" y="145" fill="#ff3366" font-family="monospace" font-size="11">• Pop-up Red LOC / GS Warning Flags</text>
    <text x="25" y="165" fill="#00e676" font-family="monospace" font-size="11">• LAND 3 / Cat IIIb Armed Annunciator</text>
    <text x="25" y="185" fill="#94a3b8" font-family="monospace" font-size="10">Label 173 (LOC) / Label 174 (GS)</text>

    <!-- Marker Beacon Annunciator Lamps -->
    <rect x="15" y="220" width="240" height="105" fill="#0b1120" stroke="#ffb300" stroke-width="1" rx="4"/>
    <text x="25" y="245" fill="#ffb300" font-family="monospace" font-size="12" font-weight="bold">Marker Beacon Annunciators</text>
    <text x="25" y="268" fill="#38bdf8" font-family="monospace" font-size="11">• OM (Blue / 400 Hz Dashes)</text>
    <text x="25" y="288" fill="#ffb300" font-family="monospace" font-size="11">• MM (Amber / 1300 Hz Dot-Dash)</text>
    <text x="25" y="308" fill="#f8fafc" font-family="monospace" font-size="11">• IM (White / 3000 Hz Dots)</text>

    <!-- Flight Control / Autopilot -->
    <rect x="15" y="340" width="240" height="105" fill="#0b1120" stroke="#00f0ff" stroke-width="1" rx="4"/>
    <text x="25" y="365" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">Autoflight System (AFDS)</text>
    <text x="25" y="388" fill="#f8fafc" font-family="monospace" font-size="11">• Rollout &amp; Flare Computer Interlock</text>
    <text x="25" y="408" fill="#f8fafc" font-family="monospace" font-size="11">• Runway Alignment Decrab Guidance</text>
    <text x="25" y="428" fill="#00e676" font-family="monospace" font-size="10">Fail-Operational Autoland</text>
  </g>

  <!-- Bus Interconnect Arrows -->
  <line x1="300" y1="220" x2="360" y2="220" stroke="#00f0ff" stroke-width="2.5"/>
  <text x="306" y="210" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">RF Signals</text>

  <line x1="640" y1="220" x2="690" y2="220" stroke="#00e676" stroke-width="2.5"/>
  <text x="645" y="210" fill="#00e676" font-family="monospace" font-size="9" font-weight="bold">ARINC 429</text>
</svg>